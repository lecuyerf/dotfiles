unbind r
bind r source-file ~/.tmux.conf; display-message "Config reloaded..."

# set -s set-clipboard on
set-option -g set-clipboard external
set-option -g mouse on
set-window-option -g mode-keys vi
# Vi-style copy bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'  # macOS
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'

set -g prefix C-s
set -g mouse on

# Set status bar position
set-option -g status-position top

# start index at 1
set -g base-index 1
set -g pane-base-index 1

# renumber windows when closing one
set -g renumber-windows on

set -g default-terminal "tmux-256color"

set-option -ga terminal-overrides ",xterm-256color:Tc"


set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'ofirgall/tmux-window-name'

set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"

set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_current_text " #{?window_name,#{window_name},#{b:pane_current_path}}"
set -g @catppuccin_window_text " #{?window_name,#{window_name},#{b:pane_current_path}}"

set -g @catppuccin_status_modules_right "directory meetings date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_background "default"
set -g @catppuccin_directory_text "#{pane_current_path}"
set -g @catppuccin_meetings_text "#($HOME/.config/tmux/scripts/cal.sh)"
set -g @catppuccin_date_time_text "%H:%M"
set -g status-position top

bind-key -r i run-shell "tmux neww tmux-cht.sh"

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Display lazygit
bind -r l display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit

bind -r g display-popup -d '#{pane_current_path}' -w90% -h90% -E gerrit-dashboard

bind -r o run-shell '\
  SESSION="docker"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "lazydocker"; \
  tmux display-popup -w90% -h90% -E "tmux attach-session -t $SESSION"'

bind -r i run-shell '\
  SESSION="interrupt"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "interrupt-dashboard"; \
  tmux display-popup -w90% -h90% -E "tmux attach-session -t $SESSION"'


bind -r y run-shell '\
  SESSION="coding-$(echo #{pane_current_path} | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "claude"; \
  tmux display-popup -w80% -h80% -E "tmux attach-session -t $SESSION"'

bind -r t run-shell '\
  SESSION="popupterm-$(echo #{pane_current_path} | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}"; \
  tmux display-popup -w80% -h80% -E "tmux attach-session -t $SESSION"'

run '~/.tmux/plugins/tpm/tpm'
